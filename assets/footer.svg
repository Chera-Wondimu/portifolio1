<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100"><path d="M20 15H980" stroke="#31475d"/><text x="500" y="55" text-anchor="middle" fill="#55d6be" font-family="monospace" font-size="15">Waan jalqabde xumuri. Waan baratte ijaari. Waan ijaarte agarsiisi.</text><text x="500" y="80" text-anchor="middle" fill="#8293a8" font-family="Arial" font-size="12">Keep learning. Keep building. Keep improving.</text></svg>
